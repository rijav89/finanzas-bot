<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: al abrir el teclado virtual el viewport
         se achica, así los bottom sheets (100dvh) quedan por encima y no debajo. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- temaStore lo actualiza según el tema activo -->
    <meta name="theme-color" content="#f6f7f9" />
    <title>FinanzasBot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
