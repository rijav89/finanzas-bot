# Bloque por nombre solo para el desafío de Let's Encrypt.
#
# El panel NO se sirve acá: mientras no haya certificado, cualquier cosa que llegue por
# el dominio en HTTP plano recibe 404. Así el login y la cookie de sesión nunca viajan
# sin cifrar por internet, ni siquiera durante la ventana previa a emitir el
# certificado.
#
# El bloque default_server del puerto 80 sigue intacto: es el que usa el túnel SSH,
# que llega con Host: localhost y por lo tanto no cae en este.
#
# Una vez emitido el certificado, certbot reescribe este archivo para redirigir a
# HTTPS y agrega el server block del 443.
server {
    listen 80;
    server_name finanzas.indexcom.pe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 404;
    }
}
