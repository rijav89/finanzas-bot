# Panel FinanzasBot — un solo origen: SPA estática + /api proxy a uvicorn.
#
# El panel vive ÚNICAMENTE en HTTPS. El puerto 80 solo atiende el desafío de
# Let's Encrypt y redirige todo lo demás, así que ni por IP ni por el dominio se
# puede llegar al login sin cifrado.

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Los headers y el proxy se repiten en varios `location`, y nginx descarta los
# add_header del padre en cuanto un hijo declara el suyo. Un include evita que se
# desincronicen.
# (ver /etc/nginx/snippets/panel-cabeceras.conf y panel-proxy.conf)

# ── Puerto 80: renovación y redirección, nada más ───────────────────────────
server {
    listen 80 default_server;
    server_name _;

    # Certbot renueva sin tocar el 443 ni cortar el servicio
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Se redirige al nombre, no a $host: entrando por IP, $host es la IP y el
    # navegador chocaría con un certificado que no la cubre.
    location / {
        return 301 https://finanzas.indexcom.pe$request_uri;
    }
}

# ── Puerto 443: el panel ────────────────────────────────────────────────────
server {
    # `http2 on;` recién existe desde nginx 1.25; acá corre 1.24 (Ubuntu 24.04),
    # donde HTTP/2 se activa como parámetro del listen.
    listen 443 ssl http2;
    server_name finanzas.indexcom.pe;

    ssl_certificate     /etc/letsencrypt/live/finanzas.indexcom.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finanzas.indexcom.pe/privkey.pem;
    include /etc/nginx/snippets/panel-ssl.conf;

    root /var/www/panel;
    index index.html;

    include /etc/nginx/snippets/panel-cabeceras.conf;
    client_max_body_size 1m;

    # Assets con hash en el nombre: cachear agresivamente es seguro.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /api/v1/auth/login {
        limit_req zone=auth burst=3;
        include /etc/nginx/snippets/panel-proxy.conf;
    }

    location = /api/v1/auth/vincular {
        limit_req zone=auth burst=3;
        include /etc/nginx/snippets/panel-proxy.conf;
    }

    # El alta no exige sesión: sin freno, alguien podría probar códigos a ciegas.
    # Son 8 caracteres alfanuméricos y viven 10 minutos, pero 5 intentos por minuto
    # convierten la fuerza bruta en algo inviable.
    location = /api/v1/auth/registrar {
        limit_req zone=auth burst=3;
        include /etc/nginx/snippets/panel-proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/snippets/panel-proxy.conf;
    }

    # index.html NUNCA se cachea: es el índice que apunta a los assets con hash.
    # Sin esto, tras un deploy el navegador sirve el HTML viejo y pide assets
    # que ya no existen (404 → pantalla en blanco).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/panel-cabeceras.conf;
    }

    # SPA fallback — debe ir al final
    location / {
        try_files $uri /index.html;
    }
}
