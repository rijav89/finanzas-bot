# Ajustes TLS del panel.
#
# Explícitos y no `options-ssl-nginx.conf`, que solo aparece si se instala el plugin
# de nginx de certbot; acá el certificado se pidió con `certonly`.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;   # en TLS1.3 manda el cliente, y elige bien
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# Sin dhparam a propósito: solo hace falta para cifrados DHE, y la lista de arriba es
# toda ECDHE. Generarlo serían minutos de CPU en una máquina de 1 vCPU para nada.

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;         # sin tickets, la sesión no se puede reutilizar si se filtra la clave

ssl_stapling on;                 # el navegador no tiene que ir a preguntar por la revocación
ssl_stapling_verify on;
resolver 169.254.169.254 valid=300s;   # DNS interno de Oracle Cloud
resolver_timeout 5s;
