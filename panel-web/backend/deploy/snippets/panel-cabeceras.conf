# Cabeceras de seguridad del panel.
#
# En un include porque nginx descarta TODOS los add_header heredados en cuanto un
# `location` declara uno propio: sin esto hay que repetirlas a mano en cada bloque y
# tarde o temprano una queda vieja.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
# Sin `preload`: eso es una lista de la que cuesta salirse. includeSubDomains solo
# afecta a subdominios de finanzas.indexcom.pe, no al dominio raíz.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
